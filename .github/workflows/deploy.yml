name: FBWeb test, build, attest and publish

on:
  push:
    branches:
      - feature/docker-cicd-deployment
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-fbweb
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up legacy PHP for compatibility verification
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, pdo_sqlite, pdo_mysql, gd, intl, zip, bcmath
          coverage: none

      - name: Validate PHP syntax
        run: |
          find app routes config database -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

      - name: Install dependencies from committed lock file
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Execute tests using isolated SQLite database
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: vendor/bin/phpunit

  publish:
    name: Build, attest and publish release images
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Laravel application
        id: app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/devnechi/fbwebltd-app:sha-${{ github.sha }}
          provenance: mode=min

      - name: Build and publish Caddy web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: ghcr.io/devnechi/fbwebltd-web:sha-${{ github.sha }}
          provenance: mode=min

      - name: Sign Laravel build attestation
        id: app_attestation
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/devnechi/fbwebltd-app
          subject-digest: ${{ steps.app.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Sign Caddy build attestation
        id: web_attestation
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/devnechi/fbwebltd-web
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Record immutable image references
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          APP_ATTESTATION: ${{ steps.app_attestation.outputs.attestation-url }}
          WEB_ATTESTATION: ${{ steps.web_attestation.outputs.attestation-url }}
        run: |
          set -euo pipefail

          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APP_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$WEB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          {
            echo "## Future Basics signed release images"
            echo
            echo "Source commit: \`$COMMIT_SHA\`"
            echo
            echo "### Laravel"
            echo "\`ghcr.io/devnechi/fbwebltd-app@$APP_DIGEST\`"
            echo
            echo "Attestation: $APP_ATTESTATION"
            echo
            echo "### Caddy"
            echo "\`ghcr.io/devnechi/fbwebltd-web@$WEB_DIGEST\`"
            echo
            echo "Attestation: $WEB_ATTESTATION"
            echo
            echo "Production deployment remains disabled."
            echo "Signing does not constitute production approval."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "PASS: Both image digests and attestation links recorded"

  deploy:
    if: ${{ false }}
    needs:
      - test
      - publish
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Production deployment intentionally disabled
        run: |
          echo "Production deployment remains disabled."
          echo "Pending signed provenance verification, trusted approval and automatic rollback."
