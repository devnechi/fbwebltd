name: FBWeb test and deploy

on:
  push:
    branches:
      - feature/docker-cicd-deployment
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-fbweb
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up legacy PHP for compatibility verification
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, pdo_sqlite, pdo_mysql, gd, intl, zip, bcmath
          coverage: none

      - name: Validate PHP syntax
        run: |
          find app routes config database -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

      - name: Install dependencies from committed lock file
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Execute tests using isolated SQLite database
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: vendor/bin/phpunit

  deploy:
    if: ${{ false }}
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Production deployment intentionally disabled
        run: |
          echo "Production deployment remains disabled."
          echo "Pending trusted release controller and registry verification."
