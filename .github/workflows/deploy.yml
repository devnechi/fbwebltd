name: FBWeb test, build, attest and deploy

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-fbweb
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python for security verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned Python security test dependencies
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            -r deploy/requirements-security-test.txt

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, pdo_sqlite, pdo_mysql, gd, intl, zip, bcmath
          coverage: none

      - name: Validate PHP syntax
        run: |
          find app routes config database -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Execute Laravel tests
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: vendor/bin/phpunit

      - name: Validate Python deployment modules
        run: python3 -m compileall -q deploy/releases deploy/tests

      - name: Execute deployment and recovery tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover \
            -s deploy/tests \
            -p 'test_*.py' \
            -v

  publish:
    name: Build, attest and publish release images
    if: >-
      ${{
        (github.event_name == 'push' ||
         github.event_name == 'workflow_dispatch') &&
        github.ref == 'refs/heads/master'
      }}
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    outputs:
      app_digest: ${{ steps.app.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}

    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate with GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Laravel application
        id: app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/devnechi/fbwebltd-app:sha-${{ github.sha }}
          provenance: mode=min

      - name: Build and publish Caddy web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: ghcr.io/devnechi/fbwebltd-web:sha-${{ github.sha }}
          provenance: mode=min

      - name: Sign Laravel build attestation
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/devnechi/fbwebltd-app
          subject-digest: ${{ steps.app.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Sign Caddy build attestation
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/devnechi/fbwebltd-web
          subject-digest: ${{ steps.web.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Record immutable release images
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          set -euo pipefail

          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APP_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$WEB_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          {
            echo "## Future Basics release"
            echo
            echo "Commit: \`$COMMIT_SHA\`"
            echo
            echo "Laravel: \`ghcr.io/devnechi/fbwebltd-app@$APP_DIGEST\`"
            echo
            echo "Caddy: \`ghcr.io/devnechi/fbwebltd-web@$WEB_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy approved release to DigitalOcean

    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/master'
      }}

    needs:
      - test
      - publish

    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read

    steps:
      - name: Prepare verified SSH configuration
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.FBWEB_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.FBWEB_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/fbweb_deploy"

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"

          chmod 600 \
            "$HOME/.ssh/fbweb_deploy" \
            "$HOME/.ssh/known_hosts"

          ssh-keygen -y -f "$HOME/.ssh/fbweb_deploy" >/dev/null
          ssh-keygen -lf "$HOME/.ssh/known_hosts"

      - name: Deploy exact approved release
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.FBWEB_DEPLOY_HOST }}
          COMMIT_SHA: ${{ github.sha }}
          APP_DIGEST: ${{ needs.publish.outputs.app_digest }}
          WEB_DIGEST: ${{ needs.publish.outputs.web_digest }}
        run: |
          set -euo pipefail

          [[ -n "$DEPLOY_HOST" ]]
          [[ "$COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$APP_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$WEB_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]

          ssh \
            -i "$HOME/.ssh/fbweb_deploy" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "fbdeploy@$DEPLOY_HOST" \
            "deploy $COMMIT_SHA $APP_DIGEST $WEB_DIGEST"

      - name: Verify public website after deployment
        shell: bash
        run: |
          set -euo pipefail

          for domain in futurebasics.co.tz www.futurebasics.co.tz; do
            status=$(curl \
              --silent \
              --show-error \
              --location \
              --output /dev/null \
              --max-time 20 \
              --write-out '%{http_code}' \
              "https://$domain/")

            echo "$domain: HTTP $status"
            [[ "$status" == "200" ]]
          done
