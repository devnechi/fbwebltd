name: Website validation

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find app routes config database \
            -type f -name '*.php' -print0 \
            | xargs -0 -r -n1 php -l > /dev/null
          echo "PHP syntax validation passed"

      - name: Install locked Laravel dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Compile Laravel Blade templates
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan view:cache

      - name: Install isolated browser test dependency
        run: |
          npm install --prefix /tmp/fbweb-browser --no-save --ignore-scripts playwright@1.56.1

      - name: Test rendered public navigation in Chrome
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_URL: http://127.0.0.1:8765
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          TEST_BASE_URL: http://127.0.0.1:8765
          NODE_PATH: /tmp/fbweb-browser/node_modules
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          php artisan serve --host=127.0.0.1 --port=8765 > /tmp/fbweb-laravel.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:8765/; then
              break
            fi
            sleep 1
          done

          if ! node tests/browser/public-navigation.cjs; then
            cat /tmp/fbweb-laravel.log
            exit 1
          fi

      - name: Validate contact page update
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          page = Path("resources/views/contact-us.blade.php")
          content = page.read_text(encoding="utf-8")

          expected = 'href="tel:00-255-687-859-500"'
          obsolete = 'href="tel:00-255-743-728-990"'

          assert expected in content, "Updated phone number missing"
          assert obsolete not in content, "Old phone number remains"

          print("Contact page validation passed")
          PY

      - name: Confirm no deployment commands
        run: |
          echo "Validation only."
          echo "No Docker execution or production deployment."
