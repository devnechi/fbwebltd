name: fbweb

services:
  app:
    image: ${FBWEB_APP_IMAGE:?Set approved application image digest}
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "/var/www/html/deploy/health/check.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    image: ${FBWEB_WEB_IMAGE:?Set approved Caddy image digest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - app_storage:/srv/storage:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Missing DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME:?Missing DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Missing DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Missing MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 15

networks:
  internal:
    name: fbweb_internal

volumes:
  app_storage:
    external: true
    name: fbweb_app_storage

  db_data:
    external: true
    name: fbweb_db_data

  caddy_data:
    external: true
    name: fbweb_caddy_data

  caddy_config:
    external: true
    name: fbweb_caddy_config
