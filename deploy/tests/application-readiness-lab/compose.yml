services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: fbweb_readiness
      MYSQL_USER: fbweb_lab
      MYSQL_PASSWORD: lab_only_not_production
      MYSQL_ROOT_PASSWORD: lab_root_not_production
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u"$${MYSQL_USER}" -D "$${MYSQL_DATABASE}" -N -e "SELECT 1" | grep -qx 1'
      interval: 5s
      timeout: 5s
      start_period: 240s
      retries: 12
    restart: "no"
    networks:
      - internal

  app:
    image: ghcr.io/devnechi/fbwebltd-app@sha256:cfea548abd17b2dd096bd896ab57d0bc5e9629344537e49e51fa0040d3feddcc
    environment:
      APP_NAME: FBWebReadinessLab
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://web:8080
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: fbweb_readiness
      DB_USERNAME: fbweb_lab
      DB_PASSWORD: lab_only_not_production
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - internal

  web:
    image: ghcr.io/devnechi/fbwebltd-web@sha256:4f1b087069eafd9c6b95101a89143a4078e7f70cf7ed60d00fe02f4dbd9119fe
    volumes:
      - ./Caddyfile.lab:/etc/caddy/Caddyfile:ro
    depends_on:
      - app
    restart: "no"
    networks:
      - internal

networks:
  internal:
    internal: true

volumes:
  db_data:
