name: fbweb-gate16g-lab

services:
  db:
    image: busybox:1.36
    command: ["sleep", "86400"]
    volumes:
      - lab_database:/data

  app:
    image: ${LAB_APP_IMAGE:?Missing LAB_APP_IMAGE}
    command: ["sleep", "86400"]
    environment:
      APP_HEALTH: ${LAB_APP_HEALTH:-good}
    healthcheck:
      test: ["CMD-SHELL", "test \"$$APP_HEALTH\" = good"]
      interval: 2s
      timeout: 2s
      retries: 2
      start_period: 1s
    depends_on:
      - db

  web:
    image: ${LAB_WEB_IMAGE:?Missing LAB_WEB_IMAGE}
    command: ["sleep", "86400"]
    depends_on:
      - app

volumes:
  lab_database:
